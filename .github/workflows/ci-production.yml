name: CI/CD Production

on:
  push:
    branches: [main, master]

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build e push de cada app
      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api-gateway
          file: ./apps/api-gateway/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/api-gateway:${{ env.IMAGE_TAG }}

      - name: Build and push auth
        uses: docker/build-push-action@v5
        with:
          context: ./apps/auth
          file: ./apps/auth/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/auth:${{ env.IMAGE_TAG }}

      - name: Build and push tasks
        uses: docker/build-push-action@v5
        with:
          context: ./apps/tasks
          file: ./apps/tasks/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/tasks:${{ env.IMAGE_TAG }}

      - name: Build and push users
        uses: docker/build-push-action@v5
        with:
          context: ./apps/users
          file: ./apps/users/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/users:${{ env.IMAGE_TAG }}

      # Testes unitários fora do container (mais rápido)
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npx nx lint

      - name: Run unit tests
        run: npx nx test

      # Testes de integração com docker-compose
      - name: Run integration tests
        run: |
          docker-compose -f docker-compose.test.yml up -d
          # Aguarde os serviços subirem, se necessário
          sleep 10
          # Execute os testes de integração (ajuste o comando conforme seu projeto)
          npx nx run users:test:e2e
          # Finalize os containers
          docker-compose -f docker-compose.test.yml down

      # (Opcional) Deploy automatizado
      # - name: Deploy to production
      #   run: |
      #     # Comando de deploy (ex: kubectl, helm, az cli, etc.)
      #     echo "Deploy step here"
