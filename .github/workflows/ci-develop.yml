name: CI/CD Development

on:
  push:
    branches: [develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Debug: lista arquivos de teste antes do build
      - name: Debug - List test files before build
        run: ls -l apps/users/test

      - name: Debug - List tasks test files
        run: ls -l apps/tasks/test || echo "tasks test folder not found"

      - name: Debug - List auth test files
        run: ls -l apps/auth/test || echo "auth test folder not found"

      - name: Debug - List api-gateway test files
        run: ls -l apps/api-gateway/test || echo "api-gateway test folder not found"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npx nx lint

      - name: Run unit tests
        run: npx nx test

      # Permite pasta de testes no build de integração removendo linhas do .dockerignore
      - name: Permitir pasta test no build de integração
        run: sed -i '/^test$/d;/apps\/*\/test/d;/libs\/*\/test/d' .dockerignore

      - name: Build all apps
        run: npx nx build

      # Cria .env.test para cada microserviço usando secrets
      - name: Create .env.test for api-gateway
        run: |
          echo "PORT=${{ vars.API_GATEWAY_PORT }}" > apps/api-gateway/.env.test
          echo "NODE_ENV=${{ vars.NODE_ENV }}" >> apps/api-gateway/.env.test
          echo "DATABASE_URL=${{ secrets.API_GATEWAY_DATABASE_URL_TEST }}" >> apps/api-gateway/.env.test
          echo "RABBITMQ_URL=${{ secrets.API_GATEWAY_RABBITMQ_URL_TEST }}" >> apps/api-gateway/.env.test

      - name: Create .env.test for auth
        run: |
          echo "PORT=${{ vars.AUTH_PORT }}" > apps/auth/.env.test
          echo "NODE_ENV=${{ vars.NODE_ENV }}" >> apps/auth/.env.test
          echo "DATABASE_URL=${{ secrets.AUTH_DATABASE_URL_TEST }}" >> apps/auth/.env.test
          echo "RABBITMQ_URL=${{ secrets.AUTH_RABBITMQ_URL_TEST }}" >> apps/auth/.env.test

      - name: Create .env.test for users
        run: |
          echo "PORT=${{ vars.USERS_PORT }}" > apps/users/.env.test
          echo "NODE_ENV=${{ vars.NODE_ENV }}" >> apps/users/.env.test
          echo "DATABASE_URL=${{ secrets.USERS_DATABASE_URL_TEST }}" >> apps/users/.env.test
          echo "RABBITMQ_URL=${{ secrets.USERS_RABBITMQ_URL_TEST }}" >> apps/users/.env.test

      - name: Create .env.test for tasks
        run: |
          echo "PORT=${{ vars.TASKS_PORT }}" > apps/tasks/.env.test
          echo "NODE_ENV=${{ vars.NODE_ENV }}" >> apps/tasks/.env.test
          echo "DATABASE_URL=${{ secrets.TASKS_DATABASE_URL_TEST }}" >> apps/tasks/.env.test
          echo "RABBITMQ_URL=${{ secrets.TASKS_RABBITMQ_URL_TEST }}" >> apps/tasks/.env.test

      - name: Run integration tests (docker-compose)
        run: |
          docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from users
          docker compose -f docker-compose.test.yml down
