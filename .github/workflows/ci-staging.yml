name: CI/CD Staging

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx nx lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx nx test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
      - name: Security audit (npm audit)
        run: npm audit --audit-level=moderate > npm-audit.txt || true
      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.txt

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx nx build

  integration-e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # Create .env.staging files for each microservice
      - name: Create .env.staging files
        run: |
          echo "PORT=${{ vars.API_GATEWAY_PORT }}" > apps/api-gateway/.env.staging
          echo "NODE_ENV=staging" >> apps/api-gateway/.env.staging
          echo "DATABASE_URL=${{ secrets.API_GATEWAY_DATABASE_URL_STAGING }}" >> apps/api-gateway/.env.staging
          echo "RABBITMQ_URL=${{ secrets.API_GATEWAY_RABBITMQ_URL_STAGING }}" >> apps/api-gateway/.env.staging

          echo "PORT=${{ vars.AUTH_PORT }}" > apps/auth/.env.staging
          echo "NODE_ENV=staging" >> apps/auth/.env.staging
          echo "DATABASE_URL=${{ secrets.AUTH_DATABASE_URL_STAGING }}" >> apps/auth/.env.staging
          echo "RABBITMQ_URL=${{ secrets.AUTH_RABBITMQ_URL_STAGING }}" >> apps/auth/.env.staging

          echo "PORT=${{ vars.USERS_PORT }}" > apps/users/.env.staging
          echo "NODE_ENV=staging" >> apps/users/.env.staging
          echo "DATABASE_URL=${{ secrets.USERS_DATABASE_URL_STAGING }}" >> apps/users/.env.staging
          echo "RABBITMQ_URL=${{ secrets.USERS_RABBITMQ_URL_STAGING }}" >> apps/users/.env.staging

          echo "PORT=${{ vars.TASKS_PORT }}" > apps/tasks/.env.staging
          echo "NODE_ENV=staging" >> apps/tasks/.env.staging
          echo "DATABASE_URL=${{ secrets.TASKS_DATABASE_URL_STAGING }}" >> apps/tasks/.env.staging
          echo "RABBITMQ_URL=${{ secrets.TASKS_RABBITMQ_URL_STAGING }}" >> apps/tasks/.env.staging
      # Run integration/e2e tests with Docker Compose
      - name: Run integration/e2e tests
        run: docker compose -f docker-compose.staging.yml up --build --abort-on-container-exit
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v
