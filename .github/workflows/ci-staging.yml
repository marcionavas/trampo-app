# ===============================
# CI Staging - Padrão profissional
#
# Pipeline para validação completa do código na branch staging.
# Executa lint, build, testes unitários, e2e e upload de cobertura.
# ===============================

name: CI Staging

on:
  push:
    branches: [staging]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Permitir testes no build do Docker (ajuste .dockerignore)
        run: |
          sed -i.bak '/^test[[:space:]]*#/d' .dockerignore
          sed -i.bak '/^apps\/\*\/test[[:space:]]*#/d' .dockerignore
          sed -i.bak '/^libs\/\*\/test[[:space:]]*#/d' .dockerignore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Set secrets as env vars
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL_STAGING }}" >> $GITHUB_ENV
          echo "RABBITMQ_URL=${{ secrets.RABBITMQ_URL_STAGING }}" >> $GITHUB_ENV

      - name: Lint
        run: npx nx lint

      - name: Build all apps
        run: npx nx build

      - name: Run unit tests
        run: npx nx test

      - name: Run e2e tests
        run: npx nx run users:test:e2e

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
