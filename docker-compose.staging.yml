services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: trampodb_staging
      POSTGRES_USER: trampo
      POSTGRES_PASSWORD: trampo123
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data_staging:/var/lib/rabbitmq

  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - ./apps/api-gateway/.env.staging
    depends_on:
      - postgres
      - rabbitmq
    ports:
      - '3000:3000'

  auth:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
    container_name: auth
    env_file:
      - ./apps/auth/.env.staging
    depends_on:
      - postgres
      - rabbitmq
    ports:
      - '3001:3001'

  users:
    build:
      context: .
      dockerfile: ./apps/users/Dockerfile
    container_name: users
    env_file:
      - ./apps/users/.env.staging
    depends_on:
      - postgres
      - rabbitmq
    ports:
      - '3002:3002'

volumes:
  postgres_data_staging:
  rabbitmq_data_staging:
